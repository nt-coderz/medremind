name: Security validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - security/medremind-audit-2026-11-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend security regression tests
        run: npm test

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build
